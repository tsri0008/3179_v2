<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Modifications in HTML</title>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h2>
        In well-vaccinated countries, surging <span class='cases_text'> cases </span> are
        no longer mirrored in <span class='deaths_text'>deaths</span>. <br> In countries where few
        are vaccinated, <span id='deaths_text'>death rates</span> are hitting record
        highs.
    </h2>

    <p>
        Weekly <span class='cases_text'> cases </span> per 100k people, and <span
        class='deaths_text'> weekly deaths </span> per 2 million.
    </p>

    <p id="l-align">Left aligned text.<br>
    </p>
    <p id="c-align">Center aligned text.<br>
    </p>
    <p id="r-align">Right aligned text.<br>
    </p>
</body>

</html>
